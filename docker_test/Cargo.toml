[package]
name = "docker_test"
version = "0.1.0"
edition = "2021"
authors = ["Heretek Team"]
description = "Docker test module voor het testen van bash scripts in containers"

[dependencies]
tempfile = "3.3.0"
thiserror = "1.0.38"
anyhow = "1.0.68"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.25", features = ["full"] }
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
assert_cmd = "2.0.8"
predicates = "2.1.5"

[[bin]]
name = "docker_test"
path = "src/main.rs"