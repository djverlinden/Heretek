[package]
name = "container_executor"
version = "0.1.0"
edition = "2021"
description = "Docker container script executor"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tempfile = "3.3.0"
dirs = "5.0.1"
sled = "0.34.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "container_executor"
path = "src/lib.rs"

[[bin]]
name = "container_executor"
path = "src/main.rs"