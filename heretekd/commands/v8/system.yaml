# System commando's voor Proxmox 8
#
# Dit bestand bevat alle systeem-gerelateerde commando's die worden gesimuleerd

# Netwerk commando's
"ifreload -a": |
  reloading network configuration...
  reload successful
"ip addr": |
  1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN
  inet 127.0.0.1/8 scope host lo
  2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP
  inet 192.168.1.100/24 brd 192.168.1.255 scope global eth0
"ip route": |
  default via 192.168.1.1 dev eth0 proto static
  192.168.1.0/24 dev eth0 proto kernel scope link src 192.168.1.100

# Cluster commando's
"pvecm status": |
  Cluster information
  -------------------
  Name:             pve-cluster
  Config Version:   1
  Transport:        knet
  Cryptokey:        aes256
  Redundant rings:  yes

  Nodelist
  --------
  Nodeid      Votes Name
  1               1 node1 (local)
  2               1 node2

# Proxmox 7+ specifieke commando's
"pvecm nodes": |
  Membership information
  ----------------------
  Nodeid      Name
  1           node1 (local)
  2           node2

# Proxmox 8 specifieke commando's
"pvecm updatecerts": |
  updating cluster certificates...
  certificates successfully updated